[pytest]
minversion = 6.0
addopts = -ra -q
# testpaths = _tests
	
markers =
    # Original widget test markers
    init: Widget initialization tests
    load_image: Image loading tests
    read_segPred: SegPred reading tests
    find_segments: Segment finding tests
    popup_window: Popup window tests
    new_entry: New entry tests
    zoom_in: Zoom in tests
    done: Done button tests
    restore: Restore button tests
    save_intermediate: Save intermediate data tests
    save_intermediate_with_exc: Save intermediate with exception tests
    load_intermediate: Load intermediate data tests
    load_intermediate_with_exc: Load intermediate with exception tests
    save_final: Save final result tests
    save_final_with_exc: Save final with exception tests
    info_image: Show info for images tests
    info_labels: Show info for labels tests
    
    # New test markers for VessQC features
    data_manager: Data manager functionality tests
    worker: Segmentation worker tests
    dialog: Loading dialog tests
    threshold: Threshold adjustment tests
    segment_count: Segment count update tests
    temp_files: Temp file handling tests
    popup: Popup window lifecycle tests
